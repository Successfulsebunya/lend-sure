name: Package KuLoan v1.4.1 hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 49e995cc63ca29efed0db69a455f63298b2d45c3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Validate PHP syntax
        shell: bash
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kuloan-hotfix
          mkdir -p /tmp/kuloan-hotfix/install/kuloan-ledger /tmp/kuloan-hotfix/source/kuloan-ledger
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' ./ /tmp/kuloan-hotfix/install/kuloan-ledger/
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/kuloan-hotfix/source/kuloan-ledger/
          (cd /tmp/kuloan-hotfix/install && zip -qr /tmp/kuloan-hotfix/kuloan-ledger-1.4.1.zip kuloan-ledger)
          (cd /tmp/kuloan-hotfix/source && zip -qr /tmp/kuloan-hotfix/kuloan-ledger-1.4.1-github.zip kuloan-ledger)
      - uses: actions/upload-artifact@v4
        with:
          name: kuloan-ledger-v1.4.1-hotfix-packages
          path: |
            /tmp/kuloan-hotfix/kuloan-ledger-1.4.1.zip
            /tmp/kuloan-hotfix/kuloan-ledger-1.4.1-github.zip
          retention-days: 7
