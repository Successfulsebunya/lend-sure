name: Publish v1.4.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: eacd281e580ef649f90da2ca396399341f9b9dd4
    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Create install package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yll-release
          mkdir -p /tmp/yll-release/your-loan-ledger
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' ./ /tmp/yll-release/your-loan-ledger/
          ( cd /tmp/yll-release && zip -qr your-loan-ledger-1.4.0.zip your-loan-ledger )

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.4.0 >/dev/null 2>&1; then
            git tag -a v1.4.0 "$RELEASE_SHA" -m "Your Loan Ledger v1.4.0"
            git push origin refs/tags/v1.4.0
          fi
          if gh release view v1.4.0 --repo Successfulsebunya/lend-sure >/dev/null 2>&1; then
            gh release upload v1.4.0 /tmp/yll-release/your-loan-ledger-1.4.0.zip --repo Successfulsebunya/lend-sure --clobber
          else
            gh release create v1.4.0 /tmp/yll-release/your-loan-ledger-1.4.0.zip --repo Successfulsebunya/lend-sure --target "$RELEASE_SHA" --title "Your Loan Ledger v1.4.0" --notes-file docs/RELEASE-1.4.0.md
          fi
