name: Apply KuLoan branding

on:
  push:
    branches:
      - branding/kuloan-ledger

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branding/kuloan-ledger
          fetch-depth: 0
      - name: Apply branding compliance patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Current runtime/public documentation files only. Historical release/check docs stay historically accurate.
          files = [
              Path('lend-sure.php'),
              Path('readme.txt'),
              Path('README.md'),
              Path('docs/USER-GUIDE.md'),
              Path('includes/class-lendsure-admin.php'),
              Path('includes/class-lendsure-db.php'),
              Path('includes/class-lendsure-management.php'),
              Path('includes/class-lendsure-reminders.php'),
              Path('includes/class-lendsure-reports.php'),
              Path('templates/acknowledgement.php'),
              Path('uninstall.php'),
          ]

          for path in files:
              text = path.read_text()
              text = text.replace('Your Loan Ledger', 'KuLoan Ledger')
              text = text.replace('your-loan-ledger', 'kuloan-ledger')
              path.write_text(text)

          # Branding/compliance release bump.
          p = Path('lend-sure.php')
          text = p.read_text().replace('Version: 1.4.0', 'Version: 1.4.1').replace("define( 'LENDSURE_VERSION', '1.4.0' );", "define( 'LENDSURE_VERSION', '1.4.1' );")
          p.write_text(text)

          p = Path('readme.txt')
          text = p.read_text().replace('Stable tag: 1.4.0', 'Stable tag: 1.4.1')
          marker = '== Changelog ==\n'
          entry = "\n= 1.4.1 =\n\n* Renamed the public plugin identity from Your Loan Ledger to KuLoan Ledger.\n* Updated the WordPress.org text domain/permalink target to `kuloan-ledger`.\n* Preserved all existing `LendSure_*` classes, `lendsure_*` database tables, options, actions, and stored data.\n* No lending calculation or database schema changes.\n"
          if marker in text and '= 1.4.1 =' not in text:
              text = text.replace(marker, marker + entry)
          p.write_text(text)

          p = Path('README.md')
          text = p.read_text().replace('**Version:** 1.4.0', '**Version:** 1.4.1')
          marker = '## Changelog\n'
          entry = "\n### 1.4.1\n\n- Renamed the public plugin identity to **KuLoan Ledger**.\n- Updated the text domain/permalink target to `kuloan-ledger`.\n- Preserved existing `LendSure_*` classes, `lendsure_*` tables/options/actions, and stored data.\n- No lending logic or database schema changes.\n"
          if marker in text and '### 1.4.1' not in text:
              text = text.replace(marker, marker + entry)
          p.write_text(text)

          release = Path('docs/RELEASE-1.4.1.md')
          release.write_text('''# KuLoan Ledger 1.4.1 — Branding & WordPress.org Compliance\n\n## Scope\n\nVersion 1.4.1 is a branding/compliance-only release following WordPress.org review feedback.\n\n## Public identity\n\n- Display name: **KuLoan Ledger**\n- Requested WordPress.org permalink: `kuloan-ledger`\n- Text domain: `kuloan-ledger`\n- Version: `1.4.1`\n\n## Backward compatibility\n\nThe established internal identifiers remain unchanged so existing installations keep their data and behavior:\n\n- `LendSure_*` PHP classes\n- `lendsure_*` custom database tables\n- `lendsure_*` WordPress options\n- `lendsure_*` actions/admin identifiers\n- Existing borrower, loan, payment, transaction, reminder, acknowledgement, and settings data\n\n## Functional scope\n\nNo lending calculations, payment allocation rules, reporting calculations, database schema, backup format, or destructive workflows are changed in this release.\n''')
          PY

          # Ensure the old current public identity/text domain is gone from runtime PHP and current docs.
          ! grep -RIn --include='*.php' -E 'Your Loan Ledger|your-loan-ledger' lend-sure.php includes templates uninstall.php
          ! grep -In -E 'Your Loan Ledger|your-loan-ledger' README.md readme.txt docs/USER-GUIDE.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lend-sure.php readme.txt README.md docs/USER-GUIDE.md docs/RELEASE-1.4.1.md includes templates uninstall.php
          git commit -m "Rename public plugin identity to KuLoan Ledger v1.4.1"
          git push origin branding/kuloan-ledger
