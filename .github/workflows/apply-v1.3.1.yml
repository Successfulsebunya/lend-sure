name: Apply v1.3.1 source

on:
  push:
    branches:
      - release/v1.3.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply v1.3.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .release-payload-00.b64 .release-payload-01.b64 .release-payload-02.b64 .release-payload-03.b64 .release-payload-04.b64 .release-payload-05.b64 .release-payload-06.b64 | base64 -d > /tmp/your-loan-ledger-1.3.1-github.zip
          rm -rf /tmp/yll-src
          mkdir -p /tmp/yll-src
          unzip -q /tmp/your-loan-ledger-1.3.1-github.zip -d /tmp/yll-src
          cp -a /tmp/yll-src/lend-sure/. .
          rm -f .release-payload-*.b64
          rm -f .github/workflows/apply-v1.3.1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Your Loan Ledger v1.3.1 with WordPress.org review compliance fixes"
          git push origin HEAD:release/v1.3.1
