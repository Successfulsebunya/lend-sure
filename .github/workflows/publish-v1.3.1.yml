name: Publish v1.3.1

on:
  push:
    branches:
      - release/v1.3.1

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: 6b25584a573a17b9068d034df73ec40e1a11fc42
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags

          if ! git ls-remote --exit-code --tags origin refs/tags/v1.3.1 >/dev/null 2>&1; then
            git tag -a v1.3.1 "$RELEASE_SHA" -m "Your Loan Ledger v1.3.1"
            git push origin refs/tags/v1.3.1
          fi

          rm -rf /tmp/yll-release
          mkdir -p /tmp/yll-release/your-loan-ledger
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' ./ /tmp/yll-release/your-loan-ledger/
          ( cd /tmp/yll-release && zip -qr your-loan-ledger-1.3.1.zip your-loan-ledger )

          if gh release view v1.3.1 --repo Successfulsebunya/lend-sure >/dev/null 2>&1; then
            gh release upload v1.3.1 /tmp/yll-release/your-loan-ledger-1.3.1.zip --repo Successfulsebunya/lend-sure --clobber
          else
            gh release create v1.3.1 /tmp/yll-release/your-loan-ledger-1.3.1.zip --repo Successfulsebunya/lend-sure --target "$RELEASE_SHA" --title "Your Loan Ledger v1.3.1" --notes-file docs/RELEASE-1.3.1.md
          fi

      - name: Remove temporary publisher workflow from release branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/publish-v1.3.1.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git commit -m "Remove temporary v1.3.1 publisher workflow"
          git push origin HEAD:release/v1.3.1
